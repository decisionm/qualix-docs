site_name: Qualix Documentation
site_description: Native Snowflake data quality, governance, and observability
site_url: https://decisionm.github.io/qualix-docs/

theme:
  name: material
  logo: assets/img/strata-logo.png
  favicon: assets/img/strata-favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Required Privileges: privileges.md
  - User Guide:
      - Using Qualix: usage.md
      - Features: features.md
  - Security & Privacy: security.md
  - Troubleshooting: troubleshooting.md
  - Support: support.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

extra:
  generator: false

copyright: Copyright &copy; 2026 Qualix
